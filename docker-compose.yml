version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_ahmadFadhilahGumantara
    restart: always
    env_file:
      - .env
    ports:
      - "22047:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ahmadFadhilahGumantara
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "44047:80"
    depends_on:
      - db

volumes:
  postgres_data: